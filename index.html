<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>dj-mixer</title>
<style>
:root {
  --bg: oklch(0.06 0.000 0);
  --surface: oklch(0.10 0.005 270);
  --surface-2: oklch(0.14 0.008 270);
  --deck-bg: oklch(0.09 0.006 270);
  --primary: oklch(0.45 0.18 270);
  --accent: oklch(0.65 0.15 70);
  --accent-glow: oklch(0.72 0.18 70);
  --ink: oklch(0.92 0.005 270);
  --muted: oklch(0.45 0.01 270);
  --border: oklch(0.18 0.01 270);
  --focus: oklch(0.50 0.18 270);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:14px}
body{
  font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:var(--bg);color:var(--ink);
  display:flex;justify-content:center;align-items:center;
  min-height:100vh;margin:0;
  -webkit-font-smoothing:antialiased;
}
.mixer{
  display:flex;align-items:stretch;gap:0;
  background:var(--surface);
  border-radius:14px;
  padding:24px;
  border:1px solid var(--border);
  box-shadow:0 0 60px oklch(0.45 0.18 270 / 0.06),0 20px 60px rgba(0,0,0,0.5);
}
.deck{
  background:var(--deck-bg);
  border-radius:10px;
  padding:18px;
  width:320px;
  display:flex;flex-direction:column;gap:10px;
  border:1px solid var(--border);
  position:relative;
}
.deck:focus-within{outline:2px solid var(--focus);outline-offset:2px}
.deck-header{
  display:flex;align-items:center;justify-content:space-between;
  font-size:10px;text-transform:uppercase;letter-spacing:2px;color:var(--muted);
}
.deck-header .kbd{
  background:var(--surface-2);padding:2px 6px;border-radius:3px;font-size:9px;color:var(--muted);
}
canvas{display:block;width:100%;height:72px;border-radius:6px;background:oklch(0.04 0 0);cursor:pointer;border:1px solid var(--border)}
.controls{display:flex;gap:6px}
.ctrl-btn,.ctrl-btn-sm{
  background:var(--surface-2);border:1px solid var(--border);
  color:var(--muted);padding:6px 14px;border-radius:5px;cursor:pointer;font:inherit;font-size:12px;
  transition:background 0.15s,color 0.15s,border-color 0.15s;
  display:inline-flex;align-items:center;justify-content:center;gap:4px;
  -webkit-tap-highlight-color:transparent;
}
.ctrl-btn:hover,.ctrl-btn-sm:hover{background:var(--surface);border-color:var(--accent);color:var(--ink)}
.ctrl-btn.on{background:oklch(0.20 0.06 70 / 0.3);border-color:var(--accent);color:var(--accent)}
.ctrl-btn-sm{padding:4px 10px;font-size:11px}

/* knobs */
.knob-row{display:flex;gap:12px;justify-content:center;padding:4px 0}
.knob-group{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1}
.knob-group label{font-size:9px;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}
.knob{
  width:36px;height:36px;border-radius:50%;
  background:radial-gradient(circle at 36% 32%,oklch(0.25 0.02 270),oklch(0.12 0.01 270));
  border:1px solid var(--border);
  cursor:pointer;position:relative;
  -webkit-tap-highlight-color:transparent;
  transition:border-color 0.15s,box-shadow 0.15s;
}
.knob:hover{border-color:var(--accent)}
.knob::after{
  content:'';position:absolute;top:4px;left:50%;
  width:3px;height:12px;border-radius:2px;
  background:var(--muted);transform:translateX(-50%);
  transition:background 0.15s;
}
.knob.active::after{background:var(--accent)}
.knob-wrap{width:36px;height:36px;cursor:pointer}

/* crossfader */
.crossfader-section{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:0 12px;gap:4px;min-width:64px;
}
.crossfader-section label{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}
.fader-track{
  position:relative;width:6px;height:180px;
  background:linear-gradient(180deg,var(--border),oklch(0.12 0.01 270),var(--border));
  border-radius:3px;cursor:pointer;
}
.fader-track::before,.fader-track::after{
  content:'';position:absolute;left:50%;transform:translateX(-50%);
  width:14px;height:10px;border-radius:50%;border:1px solid var(--border);background:var(--deck-bg);
}
.fader-track::before{top:-5px}
.fader-track::after{bottom:-5px}
.fader-knob{
  position:absolute;left:50%;transform:translateX(-50%);
  width:20px;height:10px;border-radius:2px;
  background:linear-gradient(180deg,oklch(0.30 0.02 270),oklch(0.18 0.01 270));
  border:1px solid var(--muted);cursor:grab;z-index:2;
  transition:border-color 0.15s,box-shadow 0.15s;
}
.fader-knob:hover{border-color:var(--accent);box-shadow:0 0 8px oklch(0.65 0.15 70 / 0.3)}
.fader-knob::after{
  content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:6px;height:2px;border-radius:1px;background:var(--muted);
}

.sub{font-size:10px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-label{
  display:block;background:var(--deck-bg);
  border:1px dashed var(--border);border-radius:5px;
  padding:6px 10px;text-align:center;cursor:pointer;
  font-size:11px;color:var(--muted);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  transition:border-color 0.15s,color 0.15s;
}
.file-label:hover{border-color:var(--accent);color:var(--ink)}
input[type=file]{display:none}
</style>
</head>
<body>
<div class="mixer">
  <div class="deck" id="deck-a">
    <div class="deck-header"><span>Deck A</span><span class="kbd">1</span></div>
    <label class="file-label" id="label-a">Load Track</label>
    <input type="file" id="file-a" accept="audio/*,.mp4,.m4a">
    <canvas id="wave-a" height="72"></canvas>
    <div class="controls">
      <button class="ctrl-btn" id="play-a" title="Play/Pause [Space]">▶</button>
      <button class="ctrl-btn-sm" id="cue-a" title="Set Cue Point">Cue</button>
      <button class="ctrl-btn-sm" id="loop-a" title="Loop">⟳</button>
    </div>
    <div class="knob-row">
      <div class="knob-group">
        <label>A Vol</label>
        <div class="knob-wrap" data-deck="a" data-param="vol">
          <div class="knob" id="knob-a"></div>
        </div>
      </div>
    </div>
    <div class="sub" id="info-a">Load a track to begin</div>
  </div>
  <div class="crossfader-section">
    <label>A</label>
    <div class="fader-track" id="fader-track">
      <div class="fader-knob" id="fader-knob"></div>
    </div>
    <label>B</label>
  </div>
  <div class="deck" id="deck-b">
    <div class="deck-header"><span>Deck B</span><span class="kbd">2</span></div>
    <label class="file-label" id="label-b">Load Track</label>
    <input type="file" id="file-b" accept="audio/*,.mp4,.m4a">
    <canvas id="wave-b" height="72"></canvas>
    <div class="controls">
      <button class="ctrl-btn" id="play-b" title="Play/Pause [Space]">▶</button>
      <button class="ctrl-btn-sm" id="cue-b" title="Set Cue Point">Cue</button>
      <button class="ctrl-btn-sm" id="loop-b" title="Loop">⟳</button>
    </div>
    <div class="knob-row">
      <div class="knob-group">
        <label>B Vol</label>
        <div class="knob-wrap" data-deck="b" data-param="vol">
          <div class="knob" id="knob-b"></div>
        </div>
      </div>
    </div>
    <div class="sub" id="info-b">Load a track to begin</div>
  </div>
</div>
<script>
const ctx = new (window.AudioContext || window.webkitAudioContext)();

/* knob: convert value (0-1) to rotation (-135 to 135 deg) */
function knobRot(v){return -135+v*270}
/* render all knobs from stored values */
function updateKnobs(){
  document.querySelectorAll('.knob').forEach(k=>{
    const deck=k.id.replace('knob-','');
    const val=vols[deck];
    k.style.transform=`rotate(${knobRot(val)}deg)`;
    if(val>0)k.classList.add('active');else k.classList.remove('active');
  });
}

const vols={a:1,b:1};
let xfPos=0.5;

function makeDeck(id,canvasId){
  let src=null,buf=null,gain=ctx.createGain(),playing=false,startTime=0,pausePos=0,loop=false;
  let cuePoint=0,cueSet=false;
  gain.connect(ctx.destination);
  const playBtn=document.getElementById('play-'+id);
  const cueBtn=document.getElementById('cue-'+id);
  const loopBtn=document.getElementById('loop-'+id);
  const info=document.getElementById('info-'+id);
  const fi=document.getElementById('file-'+id);
  const lb=document.getElementById('label-'+id);
  const canvas=document.getElementById('wave-'+id);
  const cctx=canvas.getContext('2d');

  function drawWave(){
    const dpr=devicePixelRatio||1;
    const cw=canvas.clientWidth,ch=canvas.clientHeight||72;
    canvas.width=cw*dpr;canvas.height=ch*dpr;
    const w=cw*dpr,h=ch*dpr;
    cctx.fillStyle='oklch(0.04 0 0)';cctx.fillRect(0,0,w,h);
    if(!buf){
      cctx.fillStyle='oklch(0.18 0.01 270)';
      cctx.font=Math.round(11*dpr)+'px system-ui';
      cctx.fillText('load a track',10*dpr,h/2+4*dpr);
      return;
    }
    const len=buf.getChannelData(0);
    const step=Math.floor(len.length/w);
    for(let i=0;i<w;i++){
      let peak=0;const end=Math.min((i+1)*step,len.length);
      for(let j=i*step;j<end;j++){const a=Math.abs(len[j]);if(a>peak)peak=a}
      const amp=Math.min(1,peak*2);
      cctx.fillStyle=amp>0.6?'oklch(0.65 0.15 70)':'oklch(0.50 0.18 270)';
      cctx.fillRect(i,h/2-peak*(h/2-4)*0.9,1,Math.max(2,peak*(h-8)*0.9));
    }
    if(playing||pausePos>0){
      const pct=pausePos/(buf.duration||1);
      const mx=pct*w;
      cctx.strokeStyle='oklch(0.92 0.005 270 / 0.7)';
      cctx.lineWidth=Math.max(1,dpr);cctx.beginPath();cctx.moveTo(mx,0);cctx.lineTo(mx,h);cctx.stroke();
    }
    if(cueSet){
      const cx=cuePoint/buf.duration*w;
      cctx.fillStyle='oklch(0.65 0.15 70)';cctx.fillRect(cx-1*dpr,h-12*dpr,2*dpr,12*dpr);
    }
  }

  function startPlay(pos){
    if(!buf)return;
    if(src)try{src.stop()}catch(e){}
    src=ctx.createBufferSource();
    src.buffer=buf;src.loop=loop;src.connect(gain);
    src.start(0,pos);startTime=ctx.currentTime;pausePos=pos;playing=true;
    playBtn.textContent='❚❚';playBtn.classList.add('on');ctx.resume();
    if(!raf)raf=requestAnimationFrame(tick);
  }
  function stopPlay(){
    if(src)try{src.stop()}catch(e){}
    playing=false;playBtn.textContent='▶';playBtn.classList.remove('on');
  }
  function togglePlay(){
    if(!buf)return;
    if(playing){stopPlay();pausePos+=ctx.currentTime-startTime;}
    else startPlay(pausePos);
  }

  function loadFile(f){
    stopPlay();pausePos=0;cuePoint=0;cueSet=false;cueBtn.classList.remove('active');
    const r=new FileReader();
    r.onload=e=>{
      ctx.decodeAudioData(e.target.result,
        b=>{
          buf=b;pausePos=0;
          lb.textContent=f.name;info.style.color='';
          const m=Math.floor(b.duration/60),s=Math.floor(b.duration%60);
          info.textContent=m+':'+String(s).padStart(2,'0')+' · '+(b.sampleRate/1000).toFixed(1)+'kHz';
          drawWave();
        },
        ()=>{info.style.color='oklch(0.65 0.15 70)';info.textContent='decode error — unsupported format'}
      );
    };
    r.readAsArrayBuffer(f);
  }
  fi.onchange=()=>{if(fi.files[0])loadFile(fi.files[0]);};
  // drag-and-drop
  const deckEl=document.getElementById('deck-'+id);
  deckEl.addEventListener('dragover',e=>{e.preventDefault();lb.style.borderColor='var(--accent)';lb.style.color='var(--ink)';});
  deckEl.addEventListener('dragleave',()=>{lb.style.borderColor='';lb.style.color='';});
  deckEl.addEventListener('drop',e=>{
    e.preventDefault();lb.style.borderColor='';lb.style.color='';
    const f=e.dataTransfer.files[0];if(f&&(f.type.startsWith('audio/')||f.type.startsWith('video/')))loadFile(f);
  });
  playBtn.onclick=togglePlay;
  cueBtn.onclick=()=>{
    if(!buf)return;
    if(playing)cuePoint=pausePos+ctx.currentTime-startTime;
    else cuePoint=pausePos;
    cueSet=true;cueBtn.classList.toggle('active');drawWave();
  };
  loopBtn.onclick=()=>{loop=!loop;loopBtn.classList.toggle('active');if(src)src.loop=loop;};

  // click canvas to seek
  canvas.onclick=e=>{
    if(!buf)return;
    const rect=canvas.getBoundingClientRect();
    const pct=(e.clientX-rect.left)/rect.width;
    const wasPlaying=playing;
    if(wasPlaying)stopPlay();
    pausePos=Math.max(0,Math.min(buf.duration-0.01,pct*buf.duration));
    if(wasPlaying)startPlay(pausePos);
    drawWave();
  };

  let raf=null;
  function tick(){
    if(playing){pausePos+=ctx.currentTime-startTime;startTime=ctx.currentTime;drawWave();raf=requestAnimationFrame(tick);}
    else raf=null;
  }

  return {gain,deck:id,buf:()=>buf,pausePos:()=>pausePos,togglePlay,stopPlay,startPlay,cuePoint:()=>cuePoint};
}

const a=makeDeck('a','wave-a');
const b=makeDeck('b','wave-b');

/* ---- volume knobs ---- */
document.querySelectorAll('.knob-wrap').forEach(wrap=>{
  const deck=wrap.dataset.deck;
  const knob=wrap.querySelector('.knob');
  let dragging=false,startY=0,startVal=0;

  function applyVol(v){
    vols[deck]=Math.max(0,Math.min(1,v));
    updateKnobs();
    updateMix();
  }

  function onPointerDown(e){
    dragging=true;startY=e.clientY;startVal=vols[deck];
    e.preventDefault();knob.setPointerCapture(e.pointerId);
  }
  function onPointerMove(e){
    if(!dragging)return;
    const dy=startY-e.clientY;
    applyVol(startVal+dy/120);
  }
  function onPointerUp(){
    if(!dragging)return;
    dragging=false;
  }
  knob.addEventListener('pointerdown',onPointerDown);
  knob.addEventListener('pointermove',onPointerMove);
  knob.addEventListener('pointerup',onPointerUp);
  knob.addEventListener('pointercancel',onPointerUp);

  // click to toggle mute
  knob.addEventListener('dblclick',()=>{
    applyVol(vols[deck]>0?0:1);
  });
});
updateKnobs();

/* ---- crossfader ---- */
const faderTrack=document.getElementById('fader-track');
const faderKnob=document.getElementById('fader-knob');
let faderDragging=false,faderStartY=0,faderStartVal=0;

function setFader(v){
  xfPos=Math.max(0,Math.min(1,v));
  const trackH=faderTrack.clientHeight;
  const knobH=faderKnob.clientHeight;
  faderKnob.style.top=((trackH-knobH)*xfPos)+'px';
  updateMix();
}

function updateMix(){
  const v=xfPos;
  a.gain.gain.value=vols.a*(1-v)*2;
  b.gain.gain.value=vols.b*v*2;
  const labels=document.querySelectorAll('.crossfader-section label');
  if(labels[0])labels[0].style.color=xfPos<0.5?'var(--accent)':'var(--muted)';
  if(labels[1])labels[1].style.color=xfPos>0.5?'var(--accent)':'var(--muted)';
}

faderTrack.addEventListener('pointerdown',e=>{
  faderDragging=true;faderStartY=e.clientY;
  faderStartVal=xfPos;
  const rect=faderTrack.getBoundingClientRect();
  setFader((e.clientY-rect.top)/rect.height);
  faderKnob.setPointerCapture(e.pointerId);
});
faderKnob.addEventListener('pointerdown',e=>{
  faderDragging=true;faderStartY=e.clientY;faderStartVal=xfPos;
  e.stopPropagation();faderKnob.setPointerCapture(e.pointerId);
});
document.addEventListener('pointermove',e=>{
  if(!faderDragging)return;
  const rect=faderTrack.getBoundingClientRect();
  setFader((e.clientY-rect.top)/rect.height);
});
document.addEventListener('pointerup',()=>{faderDragging=false;});

/* ---- keyboard ---- */
let focus='a';
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'||e.target.tagName==='LABEL')return;
  switch(e.key){
    case '1':focus='a';document.getElementById('deck-a').style.outline='2px solid var(--focus)';document.getElementById('deck-b').style.outline='none';break;
    case '2':focus='b';document.getElementById('deck-b').style.outline='2px solid var(--focus)';document.getElementById('deck-a').style.outline='none';break;
    case ' ':e.preventDefault();(focus==='a'?a:b).togglePlay();break;
    case 'ArrowLeft':setFader(Math.max(0,xfPos-0.04));break;
    case 'ArrowRight':setFader(Math.min(1,xfPos+0.04));break;
    case 'q':{const v=Math.max(0,vols.a-0.05);vols.a=v;updateKnobs();updateMix();break;}
    case 'w':{const v=Math.min(1,vols.a+0.05);vols.a=v;updateKnobs();updateMix();break;}
    case 'i':{const v=Math.max(0,vols.b-0.05);vols.b=v;updateKnobs();updateMix();break;}
    case 'o':{const v=Math.min(1,vols.b+0.05);vols.b=v;updateKnobs();updateMix();break;}
  }
});
document.getElementById('deck-a').style.outline='2px solid var(--focus)';
setFader(0.5);
</script>
</body>
</html>
